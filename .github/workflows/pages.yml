# Publishes the browser demo (web/) to GitHub Pages on every push to master.
# web/pkg is committed, so there is nothing to build: the job only copies the
# static files (minus the local dev server) and deploys them.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage site
        run: |
          mkdir _site
          cp -r web/. _site/
          rm _site/serve.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
